[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xarm-toolkit"
version = "0.1.0"
description = "Production-grade XArm 6 robotic arm toolkit: env, teleop, data collection & VLA deployment"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

dependencies = [
    "numpy==1.26.4",
    "opencv-python==4.11.0.86",
    "open3d==0.19.0",
    "pytransform3d==3.14.3",
    "zarr==2.16.1",
    "h5py==3.15.1",
    "pyrealsense2==2.56.5.9235",
    "pyspacemouse==1.1.4",
    "hidapi==0.15.0",
    "websockets==15.0.1",
    "msgpack==1.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]
lerobot = [
    "lerobot>=0.5",
    "Pillow>=10.0",
]

[project.scripts]
xarm-collect = "scripts.collect_data:main"
xarm-viz     = "scripts.visualize:main"

[tool.setuptools.packages.find]
include = ["xarm_toolkit*", "xarm*"]
exclude = ["reference*"]

[tool.ruff]
line-length = 100
target-version = "py39"
